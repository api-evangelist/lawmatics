x-pointers-deliberately-absent:
  MCPServer: mcp/lawmatics-mcp.yml exists but records deployment mode "none" — Lawmatics
    ships no MCP server, hosted or stdio. The file is an API Evangelist candidate tool
    list derived from the OpenAPI. Wiring MCPServer would assert an agent surface that
    does not exist.
  WellKnown: well-known/lawmatics-well-known.yml records 36 probes across 4 hosts and
    zero documents. The file documents an absence, not a served surface.
  SecurityTxt: /.well-known/security.txt returns 404 on every Lawmatics host.
  AgentCard: /.well-known/agent-card.json and /.well-known/agent.json return 404 (or
    403 on the S3-fronted app host) on every Lawmatics host. Nothing was written to
    a2a/ — an agent card is never authored on a provider's behalf.
  Security: probe-security-programs.py found no vulnerability-disclosure policy, no
    security@ contact and no bug-bounty program on 2026-08-13.
  TrustCenter: no trust centre, no report portal and no subprocessor list. Certifications
    are published as prose on the marketing security page, which is wired as Compliance.
  Idempotency: the Lawmatics REST API documents no idempotency key on any of its 177
    operations. The only idempotency in the platform is consumer-side de-duplication
    of webhook deliveries on event_id, which is not an idempotency contract on writes.
  SDKs: Lawmatics publishes no first-party API client library in any language.
  AsyncAPI: webhooks are documented in prose only; no AsyncAPI document is published.
  Sandbox: no sandbox, test mode or test credentials exist.
  Deprecation: no deprecation policy, notice period or Sunset header support is published.
