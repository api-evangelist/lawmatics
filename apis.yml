name: Lawmatics
description: Lawmatics is a legal CRM, client-intake and marketing-automation platform
  for law firms, from solo practices to multi-office firms. Its public developer surface
  is the Lawmatics OAuth API — a REST API of 177 operations across matters (called
  prospects in the API), contacts, companies, custom intake forms and form entries,
  custom fields, collections, pipelines, stages, practice areas, marketing sources
  and campaigns, events, tasks, notes, files, tags, users, time entries, expenses,
  invoices and transactions — plus a set of signed outbound webhooks. Access is OAuth
  2.0 authorization code, gated on a Lawmatics support representative enabling developer
  settings on the account, and the resulting access token is non-expiring, unscoped
  and grants full CRUD over the firm.
