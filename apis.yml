apis:
  - name: Lawmatics OAuth API
    description: RESTful OAuth API for managing leads, matters, contacts, intake forms,
      pipelines, and automated client follow-ups within the Lawmatics legal CRM platform.
      177 operations over 95 paths, all under /v1, using a JSON:API-shaped data/attributes/relationships
      envelope and a shared query grammar for field selection, pagination, sorting
      and single-field filtering.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://docs.lawmatics.com/
    baseURL: https://api.lawmatics.com
    tags:
      - Legal CRM
      - Leads
      - Matters
      - Contacts
      - Intake Forms
      - Pipelines
      - Automation
    properties:
      - type: Documentation
        url: https://docs.lawmatics.com/
      - type: OpenAPI
        url: openapi/lawmatics-openapi.yml
      - type: Postman
        url: postman/lawmatics-oauth-api.postman_collection.json
    x-evidence:
      verified: '2026-08-13'
      base_url_correction: https://app.lawmatics.com/api was recorded as the base and
        is wrong — it returns HTTP 403 AccessDenied from S3. Every curl example in
        the Lawmatics Param Guide and the OAuth token endpoint use https://api.lawmatics.com,
        and GET https://api.lawmatics.com/v1/contacts returned HTTP 401 unauthenticated
        on 2026-08-13, confirming the host serves the documented API.
      contract: https://docs.lawmatics.com/ publishes the "Lawmatics OAuth API v1.22.0"
        Postman collection (186 requests, 216 saved response examples) as its official
        API documentation. Saved verbatim to postman/ and converted to openapi/.
