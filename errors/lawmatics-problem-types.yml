  gap: >-
    Only two of 177 operations carry a provider-published error example (Download File 404, Activities
    422). Validation errors on the many POST/PUT operations are undocumented; the 1.9.0 and 1.7.0
    changelog entries both say "Improve validations, and error handling on many endpoints" without
    publishing what those errors are.
