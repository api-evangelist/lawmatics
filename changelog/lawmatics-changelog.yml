location: >-
  There is no standalone changelog page. The dated changelog lives inside the description of the
  published Postman collection, so it renders at the top of docs.lawmatics.com and is versioned with
  the collection (currently "Lawmatics OAuth API v1.22.0"). It is human-readable prose, not a feed -
