breaking_change_policy: >-
  None published. Every recorded entry is additive (new endpoints, new fields, new filter operators)
  or a bug fix; the changelog records no removals, no deprecations and no sunset dates across its
  full history from 2019 to 2026.
cadence_note: >-
  Release cadence has slowed markedly. Fourteen versions shipped between 2022-04 and 2023-10, then
  nothing until 1.22.0 on 2026-05-26 - a gap of roughly 19 months between 1.21.0 and 1.22.0.
