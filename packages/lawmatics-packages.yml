summary:
  official_api_clients: 0
  official_packages: 1
  note: >-
    Lawmatics publishes NO first-party API client library in any language. The one first-party
    package found on a public registry is a fork of a rich-text editor used inside the Lawmatics
    product, not an SDK for the Lawmatics OAuth API. Because no official client library exists, this
    artifact deliberately does NOT carry an `SDKs` pointer in apis.yml - the sdk_count checks must
    read zero for this provider, which is the true measurement. Lawmatics' own help centre confirms
    the position: "both the REST API and Outbound Webhooks require technical implementation
    resources" and names no SDK.
