                          type: daily
                          frequency: 2
                          endDate: 08/15/2023
                        created_at: '2023-07-05T10:49:06.424-07:00'
                        updated_at: '2023-07-05T10:49:06.450-07:00'
                      relationships:
                        users:
                          data: []
                        taskable:
                          data:
                            id: '471'
