openapi: 3.2.0
info:
  title: Lawmatics OAuth Addresses API
  version: 1.22.0
  description: 'The official Lawmatics REST API for legal CRM, client intake and law firm automation. Manage matters (prospects), contacts, companies, custom forms and form entries, custom fields, events and appointments, tasks, notes, files, tags, users, time entries, expenses, invoices and transactions.


    Authentication is OAuth 2.0 authorization code grant; access tokens do not expire, there are no refresh tokens, and Lawmatics does not currently support scopes - an authorized app receives full CRUD access to the granted account.


    All list endpoints support the shared query-parameter grammar documented in the Param Guide: `fields` (field selection, one level deep, `fields=all` to expand), `page` (pagination), `sort_by`/`sort_order`, and `filter_by`/`filter_on`/`filter_with` (one filter at a time; operators `=`, `!=`, `<=`, `<`, `>=`, `>`, `like`, `ilike`, `null`, `not_null`).


    Responses follow a JSON:API-style `data` / `attributes` / `relationships` envelope.'
  contact:
    name: Lawmatics API Support
    email: api@lawmatics.com
    url: https://docs.lawmatics.com/
  termsOfService: https://www.lawmatics.com/terms-of-use
servers:
- url: https://api.lawmatics.com
  description: Lawmatics production API
security:
- oauth2: []
- bearerAuth: []
tags:
- name: Addresses
  description: An Address belongs to a Firm, a Contact, or Company.
paths:
  /v1/addresses/{address_id}:
    get:
      operationId: getAddress
      summary: Address
      description: A specific Stage by id
      tags:
      - Addresses
      parameters:
      - name: address_id
        in: path
        required: true
        description: The address id
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              examples:
                getAddress:
                  summary: GET Address
                  value:
                    data:
                      id: '101'
                      type: address
                      attributes:
                        label: Miami St
                        street: 1234 Miami
                        street2: null
                        city: Miami
                        state: FL
                        zipcode: '12345'
                        country: United States
                      relationships: {}
        '401':
          description: Unauthorized - missing or invalid OAuth 2.0 bearer token
        '429':
          description: Too Many Requests - the per-firm rate limit was exceeded; a Retry-After header is returned
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
    put:
      operationId: updateAddress
      summary: Update Address
      description: Updates an Address by ID
      tags:
      - Addresses
      parameters:
      - name: address_id
        in: path
        required: true
        description: The address id
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              label: Home
              street: 5555 Real Street
              street2: Apt 77
              city: Real Town
              state: CA
              country: United States
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              examples:
                putUpdateAddress:
                  summary: PUT Update Address
                  value:
                    data:
                      id: '122'
                      type: address
                      attributes:
                        label: Home
                        street: 5555 Real Street
                        street2: Apt 77
                        city: Real Town
                        state: CA
                        zipcode: '92104'
                        country: United States
                      relationships:
                        addressable:
                          data:
                            id: '1'
                            type: contact
        '401':
          description: Unauthorized - missing or invalid OAuth 2.0 bearer token
        '429':
          description: Too Many Requests - the per-firm rate limit was exceeded; a Retry-After header is returned
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
    delete:
      operationId: deleteAddress
      summary: Delete Address
      description: 'Delete an Address


        address_id: ID of the Address to delete'
      tags:
      - Addresses
      parameters:
      - name: address_id
        in: path
        required: true
        description: The address id
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              examples:
                deleteDeleteAddress:
                  summary: DELETE Delete Address
                  value:
                    data:
                      id: '122'
                      type: address
                      attributes:
                        label: Home
                        street: 5555 Real Street
                        street2: Apt 77
                        city: Real Town
                        state: CA
                        zipcode: '92104'
                        country: United States
                      relationships:
                        addressable:
                          data:
                            id: '1'
                            type: contact
        '401':
          description: Unauthorized - missing or invalid OAuth 2.0 bearer token
        '429':
          description: Too Many Requests - the per-firm rate limit was exceeded; a Retry-After header is returned
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
