    post:
      operationId: createAddress
      summary: Create Address
      description: 'Create a new Address


        Required Fields: addressable, label, street


        addressable_type: Prospect, Contact, Company, or Firm that the Address belongs to.


        addressable_id: Id of Record. Firm type doesn''t need an ID passed and it will be ignored.


        Note - Setting the Address through a Prospect (Matter) will set the address on the Prospects'' Contact/Company.'
      tags:
      - Addresses
      parameters:
      - name: fields
        in: query
        required: false
        schema:
          type: string
        example: all
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              label: Home
              street: 1234 Fake Street
              street2: Apt 1
              city: Fake Town
              state: CA
              zipcode: '92104'
              addressable_type: Firm
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
              examples:
                postCreateAddress:
                  summary: POST Create Address
                  value:
                    data:
                      id: '122'
                      type: address
                      attributes:
                        label: Primary
                        street: 1234 Fake Street
                        street2: Apt 1
                        city: Fake Town
                        state: CA
                        zipcode: '92104'
                        country: null
                        full_address: 1234 Fake Street, Apt 1, Fake Town, CA 92104
                        full_street: 1234 Fake Street, Apt 1
