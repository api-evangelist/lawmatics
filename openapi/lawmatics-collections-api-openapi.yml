      parameters:
      - name: collection_id
        in: path
        required: true
        description: The collection id
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              custom_fields:
              - id: '{{collection_custom_field_id}}'
                name: Account Balance
      responses:
        default:
          description: Example response captured in the source Postman collection; the HTTP status code was not recorded by the publisher.
          content:
            application/json:
              schema:
                type: object
              examples:
                updateCollection:
