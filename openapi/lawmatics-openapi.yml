    post:
      operationId: createCollection
      summary: Create Collection
      description: 'Creates a new Collection in Lawmatics. Collections are used to group and organize
        records (such as contacts or matters) with custom fields tailored to your needs.


        Request Body

        The request body must be a JSON object with the following fields:


        Field

        Type

        Required

        Description


        name

        string

        Yes

        The name of the collection to create.


        custom_fields

        array

        No

        An array of custom field definitions to attach to the collection.


        Custom Field Object

        Each object in the custom_fields array supports the following properties:


        Field

        Type

        Required

        Description


        name

        string

        Yes

        The display name of the custom field.


        field_type

        string

        Yes

        The type of the field. Supported values: integer, boolean, string, text, currency, date, time,
        datetime, list, lookup, multi_picklist


        list_options

        array

        Only for list and multi_picklist types

        An array of option objects, each with a name property, defining the selectable values for a list
        field.


        Response

        Returns 201 Created on success with a JSON object containing the created collection''s data under
        the data key.


        Response Body


        Field

        Type

        Description


        data.id

        string

        The unique ID of the newly created collection.


        data.type

        string

        The resource type (collection).


        data.attributes.name

        string

        The name of the collection.


        data.attributes.custom_fields

        array

        The list of custom fields created for this collection, each including id, name, field_type, visibility,
        created_at, and updated_at.


        data.attributes.created_at

        string

        ISO 8601 timestamp of when the collection was created.


        data.attributes.updated_at

        string

        ISO 8601 timestamp of when the collection was last updated.'
      tags:
