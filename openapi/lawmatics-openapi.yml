  /v1/forms/{custom_form_uuid}/submit:
    post:
      operationId: submitCustomFormEntryFormDataBody
      summary: Submit Custom Form Entry  (Form Data Body)
      description: 'This Unauthenticated (YOU DO NOT NEED A DEVELOPER APP) endpoint submits Custom Form
        values. Keys for the values use the Custom Form field ids found in Lawmatics, or found via the
        GET endpoint.


        Data should be serialized via form-data (plain html5 forms) or JSON body (shown in next example)


        Any automations will trigger as expected when this Custom Form is submitted via the API.


        This endpoint is marked `noauth` in the published collection: public custom-form submission does
        not require an OAuth access token.'
      tags:
      - Custom Forms
      parameters:
      - name: custom_form_uuid
        in: path
        required: true
        description: The custom form uuid
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                utm_source:
                  type: string
                utm_campaign:
                  type: string
                referring_url:
                  type: string
                RmllbGRzOjpDdXN0b21GaWVsZC1DdXN0b21GaWVsZDo6UHJvc3BlY3QtMTAyNw==:
                  type: string
                custom_field_2263:
                  type: string
          application/json:
            schema:
              type: object
            example:
              first_name: Another
              last_name: Test
              utm_source: facebook
              utm_campaign: test1
              RmllbGRzOjpDdXN0b21GaWVsZC1DdXN0b21GaWVsZDo6UHJvc3BlY3QtMTAyNw==: An important case
              custom_field_2263: FILL ME IN
      security: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
              examples:
                postSubmitCustomFormFormDataBody:
                  summary: POST Submit Custom Form (Form Data Body)
                  value:
                    data:
                      id: '58956'
                      type: contact
                      attributes:
                        first_name: Bob
                        last_name: Loblaw
                        email: bob@loblaw.com
                        created_at: '2018-10-17T12:43:21.570-07:00'
                        updated_at: '2018-10-17T12:43:21.570-07:00'
                      relationships: {}
        '429':
          description: Too Many Requests - the per-firm rate limit was exceeded; a Retry-After header
            is returned
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
