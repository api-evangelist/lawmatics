note: 'Lawmatics ships NO MCP server - not hosted, not stdio, not a package. This is a CANDIDATE tool
  list derived from the OpenAPI that API Evangelist converted from the Lawmatics-published Postman collection;
  it is a design input, not an agent surface anyone can call today. Third-party Lawmatics MCP servers
  do exist (for example github.com/dschnurbusch/lawmatics-mcp-server and community servers from My Legal
  Academy) but none is published or endorsed by Lawmatics, so none is recorded as this provider''s deployment.
  `auth: oauth` records what a server WOULD have to use: the Lawmatics OAuth 2.0 authorization-code grant,
  which today issues a non-expiring, unscoped, full-CRUD token - a material constraint on any agent deployment.'
